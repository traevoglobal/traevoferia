[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Las páginas estáticas de /p/ existen en dist y se sirven antes que este fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
